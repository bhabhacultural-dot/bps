<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Under Construction</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<link rel="icon" href="assets/fevicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="assets/fevicon.ico">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#4e73df,#1cc88a);
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:500px;
width:100%;
}

img{
width:220px;
max-width:100%;
margin-bottom:20px;
animation:float 3s ease-in-out infinite;
}

h1{
font-size:32px;
margin-bottom:10px;
}

p{
opacity:0.9;
margin-bottom:25px;
line-height:1.5;
}

button{
padding:12px 25px;
border:none;
border-radius:8px;
background:white;
color:#333;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:0.25s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0)}
}

</style>
</head>

</button>

<script>

const role = localStorage.getItem("role");

if(role === "principal"){
window.location.href="principal-dashborad.html.html";
}
else{
window.location.href="teacher-dashboard.html";
}

}

</script>
