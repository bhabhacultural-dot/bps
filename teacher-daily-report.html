<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Report</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/principal-daily-report.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/utilities.css">
<link rel="stylesheet" href="css/daily-report.css">
</head>

<body class="teacher-body">

<div id="headerContainer"></div>

<div id="overlay" onclick="toggleMenu()"></div>

<div class="card">

  <div style="display:flex; gap:10px; margin-bottom:15px;">
    <button class="mode-btn" id="subjectBtn">Subject Teacher</button>
    <button class="mode-btn" id="classBtn">Class Teacher</button>
  </div>

  <div id="formSection"></div>

  <div id="dataSection" style="margin-top:20px;"></div>

  <div id="actionButtons" style="margin-top:20px; display:none; gap:10px;">
    <button id="pdfBtn" style="flex:1;">Download Report</button>
    <button id="shareBtn" style="flex:1; background:#36b9cc;">Share Report</button>
  </div>

</div>


<div id="reportContainer" style="position:absolute; left:-9999px;"></div>


<div id="toast"></div>

<div id="confirmModal" class="confirm-modal">
  <div class="confirm-box">
    
    <h3>Delete Entry</h3>
    <p>Are you sure you want to delete this entry?</p>

    <div class="confirm-buttons">
      <button id="confirmDelete" class="delete-btn">Delete</button>
      <button id="cancelDelete" class="cancel-btn">Cancel</button>
    </div>

  </div>
</div>


<!-- PDF LIBRARIES -->


<script type="module" src="js/report-generator.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- FIREBASE MODULE FILES -->
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/teacher-daily-report.js"></script>
<script type="module" src="js/pdf.js"></script>
<script type="module" src="js/component-loader.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
